[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "llm_api_access"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
]
description = "Unified interface to query popular LLM providers via PyO3"
authors = [{ name = "scionsamurai", email = "scionsamurai@gmail.com" }]
dependencies = [
    "python-dotenv>=1.0.0",
]

[tool.maturin]
features = ["python"]
module-name = "llm_api_access"