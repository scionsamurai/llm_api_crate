[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "llm_api_access"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
]
description = "Unified interface to query popular LLM providers"
dependencies = [
    "python-dotenv>=1.0.0",
]

[tool.maturin]
# Tells maturin to pull the version (and other metadata) straight from Cargo.toml
manifest-path = "Cargo.toml"
features = ["python"]
module-name = "llm_api_access"